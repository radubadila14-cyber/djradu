name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Clippy
        run: cargo clippy -p telemetry-core -p telemetry-sim -p telemetry-viewer -- -D warnings
      - name: Test
        run: cargo test -p telemetry-core -p telemetry-sim -p telemetry-viewer
