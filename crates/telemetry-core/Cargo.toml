[package]
name = "telemetry-core"
version = "0.1.0"
edition = "2021"
description = "Core telemetry types, schemas, and validation for Radu's Trading System"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1.0.102"
