[package]
name = "telemetry-viewer"
version = "0.1.0"
edition = "2024"
description = "KPI calculator: reads a JSONL trace and computes latency, slippage, and fill stats"

[[bin]]
name = "telemetry-viewer"
path = "src/main.rs"

[dependencies]
telemetry-core = { path = "../telemetry-core" }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
serde_json = "1.0.149"
