[workspace]
members = [
    ".",
    "crates/telemetry-core",
    "crates/telemetry-sim",
    "crates/telemetry-viewer",
]
resolver = "3"

[package]
name = "radu-trading-system"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
redis = { version = "1.2.0", features = ["tokio-comp"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres"] }
telemetry-core = { path = "crates/telemetry-core", optional = true }
tokio = { version = "1.51.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3"

[features]
# Enable telemetry-core integration at system boundaries (startup, DB, cache).
# Off by default so the app compiles without the telemetry crate.
#
# Enable with:  cargo build --features telemetry-integration
telemetry-integration = ["dep:telemetry-core"]
